name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks and CLI smoke tests
        run: npm test

      - name: Run project-owned Node.js tests
        shell: bash
        run: |
          test_files=()
          while IFS= read -r -d '' file; do
            test_files+=("$file")
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './tools' -prune -o \
            -path './.git' -prune -o \
            -type f \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.spec.js' -o -name '*.spec.mjs' \) \
            -print0)
          if (( ${#test_files[@]} == 0 )); then
            echo "No project-owned Node.js test files found; skipping test runner."
          else
            node --test "${test_files[@]}"
          fi

      - name: Check shell script syntax
        shell: bash
        run: |
          shopt -s nullglob
          scripts=( ./*.sh )
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found; skipping."
          else
            bash -n "${scripts[@]}"
          fi

      - name: Build desktop frontend
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
